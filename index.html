<body class="min-h-screen text-slate-800 pb-12 flex flex-col items-center">

  <header class="w-full max-w-md px-5 pt-8 pb-4 text-white text-center">

  <main class="w-full max-w-md px-4 space-y-4">

    <!-- Card de Progresso Geral -->

      <div class="flex justify-between items-end mb-2">
        <div>
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Progresso Geral</span>

          <span class="text-xs text-slate-500 font-semibold">dias concluídos</span>
        </div>
        <div class="text-right">
          <span id="percentage-text" class="text-3xl font-black text-[#F31908]">0%</span>
        </div>
      </div>

      <div class="w-full bg-slate-100 h-3.5 rounded-full overflow-hidden p-0.5 border border-slate-200">
        <div id="progress-bar" class="bg-gradient-to-r from-red-500 to-[#F31908] h-full rounded-full transition-all duration-500 ease-out w-0 shadow-sm"></div>
      </div>

        <div class="bg-slate-50 p-2 rounded-xl">
          <span class="text-[10px] uppercase font-bold text-slate-400 block">Resolvidas</span>
          <span id="total-questions" class="text-base font-extrabold text-slate-700">0</span>
        </div>
        <div class="bg-slate-50 p-2 rounded-xl">
          <span class="text-[10px] uppercase font-bold text-slate-400 block">Média/Dia</span>
          <span id="avg-questions" class="text-base font-extrabold text-slate-700">0</span>
        </div>
        <div class="bg-slate-50 p-2 rounded-xl">
          <span class="text-[10px] uppercase font-bold text-slate-400 block">Restantes</span>
          <span id="remaining-days" class="text-base font-extrabold text-slate-700">15</span>
        </div>
      </div>
    </div>

    <!-- Lista de Dias -->
    <div id="days-container" class="space-y-2.5">
      <!-- Injetado via JS -->
    </div>

    <!-- Ações e Reset -->
    <div class="pt-4 flex justify-between items-center px-2">
      <button onclick="resetData()" class="text-xs font-bold text-white/70 hover:text-white flex items-center gap-1.5 transition-colors">
        <i class="fa-solid fa-rotate-right"></i> Reiniciar Desafio
      </button>
      <span class="text-[10px] text-white/60 font-medium">Salvo automaticamente</span>
    </div>

  </main>

  <script>
    const TOTAL_DAYS = 15;
    const DEFAULT_GOAL = 30;
    
    let appState = JSON.parse(localStorage.getItem('desafio_15_dias_state')) || Array.from({ length: TOTAL_DAYS }, (_, i) => ({
      day: i + 1,
      completed: false,
      count: 0,
      note: ''
    }));

    function saveState() {
      localStorage.setItem('desafio_15_dias_state', JSON.stringify(appState));
      updateStats();
    }

    function toggleDay(index) {
      appState[index].completed = !appState[index].completed;
      if (appState[index].completed && appState[index].count === 0) {
        appState[index].count = DEFAULT_GOAL;
      }
      saveState();
      renderDays();
      checkAllCompleted();
    }

    function updateCount(index, value) {
      const val = parseInt(value) || 0;
      appState[index].count = Math.max(0, val);
      if (appState[index].count >= DEFAULT_GOAL) {
        appState[index].completed = true;
      }
      saveState();
      renderDays();
    }

    function adjustCount(index, delta) {
      appState[index].count = Math.max(0, (appState[index].count || 0) + delta);
      if (appState[index].count >= DEFAULT_GOAL) {
        appState[index].completed = true;
      }
      saveState();
      renderDays();
    }
